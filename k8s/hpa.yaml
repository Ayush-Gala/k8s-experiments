# Horizontal Pod Autoscaler for php-apache
# Automatically scales pods based on CPU utilization
#
# Scaling behavior with balanced workload:
#   - 100-200 users → 3 pods (baseline)
#   - 500 users     → ~5 pods
#   - 1000 users    → 8 pods (max)
#
# Lower CPU target (40%) makes scaling more responsive

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache-hpa
  namespace: k8s-resilience-experiment
  labels:
    experiment: resilience-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 3
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 40  # Lower target = more aggressive scaling
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

