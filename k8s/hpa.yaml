# Horizontal Pod Autoscaler for php-apache
# Automatically scales pods based on CPU utilization
# This demonstrates Kubernetes' ability to handle varying loads
#
# SCALE PROFILES:
#   - Small (default):  minReplicas=3,  maxReplicas=10   (up to 100 users)
#   - Medium:           minReplicas=5,  maxReplicas=30   (up to 1,000 users)
#   - Large:            minReplicas=10, maxReplicas=100  (up to 10,000 users)
#
# To change scale profile, update minReplicas and maxReplicas below

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache-hpa
  namespace: k8s-resilience-experiment
  labels:
    experiment: resilience-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 3
  maxReplicas: 100  # Increased for high-scale testing (10,000 users)
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4  # Increased for faster scale-up
        periodSeconds: 15
      selectPolicy: Max

