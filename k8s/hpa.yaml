# Horizontal Pod Autoscaler for php-apache
# Automatically scales pods based on CPU utilization
# This demonstrates Kubernetes' ability to handle varying loads
#
# Configuration for Killercoda (single-node, limited resources):
#   - minReplicas: 3 (ensures availability during failures)
#   - maxReplicas: 8 (prevents resource exhaustion on single node)
#   - targetCPU: 50% (triggers scaling at moderate load)

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache-hpa
  namespace: k8s-resilience-experiment
  labels:
    experiment: resilience-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 3
  maxReplicas: 8  # Limited for Killercoda single-node environment
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

