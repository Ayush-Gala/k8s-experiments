# Locust Load Generator Deployment for Kubernetes
# Runs within the cluster for accurate network simulation

apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: k8s-resilience-experiment
  labels:
    app: locust
    role: master
    experiment: resilience-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
      role: master
  template:
    metadata:
      labels:
        app: locust
        role: master
    spec:
      containers:
      - name: locust
        image: locustio/locust:latest
        ports:
        - containerPort: 8089
          name: web
        - containerPort: 5557
          name: master
        command:
        - locust
        args:
        - "-f"
        - "/locust/locustfile.py"
        - "--master"
        - "--host=http://php-apache.k8s-resilience-experiment.svc.cluster.local"
        volumeMounts:
        - name: locust-scripts
          mountPath: /locust
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: locust-scripts
        configMap:
          name: locust-scripts
---
# Locust Worker Deployment (for distributed load generation)
# SCALING GUIDE:
#   - Each worker can handle ~500-1000 simulated users
#   - For 1,000 users:  2-3 workers
#   - For 10,000 users: 10-20 workers
#   - Adjust replicas below based on your target user count
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: k8s-resilience-experiment
  labels:
    app: locust
    role: worker
    experiment: resilience-test
spec:
  replicas: 10  # Increased for high-scale testing (supports ~5,000-10,000 users)
  selector:
    matchLabels:
      app: locust
      role: worker
  template:
    metadata:
      labels:
        app: locust
        role: worker
    spec:
      containers:
      - name: locust
        image: locustio/locust:latest
        command:
        - locust
        args:
        - "-f"
        - "/locust/locustfile.py"
        - "--worker"
        - "--master-host=locust-master"
        volumeMounts:
        - name: locust-scripts
          mountPath: /locust
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: locust-scripts
        configMap:
          name: locust-scripts
---
# Locust Worker HPA - Auto-scale workers based on CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: locust-worker-hpa
  namespace: k8s-resilience-experiment
  labels:
    experiment: resilience-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: locust-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
# Service to expose Locust Web UI
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: k8s-resilience-experiment
  labels:
    app: locust
    experiment: resilience-test
spec:
  type: NodePort
  ports:
  - port: 8089
    targetPort: 8089
    nodePort: 30089
    name: web
  - port: 5557
    targetPort: 5557
    name: master
  selector:
    app: locust
    role: master

