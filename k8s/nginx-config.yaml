# Nginx configuration with Lua CPU simulation
# Uses OpenResty (nginx + Lua) to generate CPU load on each request

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: k8s-resilience-experiment
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            default_type 'text/plain';
            
            # Lua script that performs CPU calculations
            # 40,000 iterations - balanced for HPA scaling
            content_by_lua_block {
                local x = 0.0001
                for i = 1, 40000 do
                    x = x + math.sqrt(x)
                end
                ngx.say("OK!")
            }
        }

        location /health {
            default_type 'text/plain';
            return 200 'healthy\n';
        }
    }
