# PHP-Apache Deployment for Kubernetes Resilience Experiment
# Uses the CPU-intensive hpa-example image with balanced resource limits
# Designed to trigger HPA scaling at ~500-1000 users

apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: k8s-resilience-experiment
  labels:
    app: php-apache
    experiment: resilience-test
spec:
  replicas: 3  # Start with 3 replicas
  selector:
    matchLabels:
      run: php-apache
  template:
    metadata:
      labels:
        run: php-apache
        app: php-apache
    spec:
      containers:
      - name: php-apache
        image: registry.k8s.io/hpa-example  # CPU-intensive workload
        ports:
        - containerPort: 80
          name: http
        resources:
          # Balanced resources - allows scheduling while enabling HPA scaling
          limits:
            cpu: 200m      # Lower limit = faster CPU saturation
            memory: 64Mi
          requests:
            cpu: 100m      # Low request = more pods can be scheduled
            memory: 32Mi
        # Liveness probe - Kubernetes will restart container if this fails
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 3
        # Readiness probe - Pod won't receive traffic until this passes
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 3
          timeoutSeconds: 3
---
# Service to expose the deployment
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: k8s-resilience-experiment
  labels:
    run: php-apache
    experiment: resilience-test
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    run: php-apache
---
# NodePort Service for external access (useful in Killercoda)
apiVersion: v1
kind: Service
metadata:
  name: php-apache-nodeport
  namespace: k8s-resilience-experiment
  labels:
    run: php-apache
    experiment: resilience-test
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    run: php-apache
