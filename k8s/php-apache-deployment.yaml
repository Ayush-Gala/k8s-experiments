# Nginx Deployment for Kubernetes Resilience Experiment
# Using lightweight nginx instead of php-apache to minimize CPU load
# Focus: Self-healing and failure recovery, not HPA scaling

apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: k8s-resilience-experiment
  labels:
    app: php-apache
    experiment: resilience-test
spec:
  replicas: 3  # Start with 3 replicas for resilience testing
  selector:
    matchLabels:
      run: php-apache
  template:
    metadata:
      labels:
        run: php-apache
        app: php-apache
    spec:
      containers:
      - name: php-apache
        image: nginx:alpine  # Lightweight image, minimal CPU usage
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 100m      # Reduced from 500m
            memory: 64Mi   # Reduced from 128Mi
          requests:
            cpu: 50m       # Reduced from 200m
            memory: 32Mi   # Reduced from 64Mi
        # Liveness probe - Kubernetes will restart container if this fails
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 2
        # Readiness probe - Pod won't receive traffic until this passes
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 3
          timeoutSeconds: 2
      # Spread pods across nodes for better availability
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            run: php-apache
---
# Service to expose the deployment
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: k8s-resilience-experiment
  labels:
    run: php-apache
    experiment: resilience-test
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    run: php-apache
---
# NodePort Service for external access (useful in Killercoda)
apiVersion: v1
kind: Service
metadata:
  name: php-apache-nodeport
  namespace: k8s-resilience-experiment
  labels:
    run: php-apache
    experiment: resilience-test
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    run: php-apache
