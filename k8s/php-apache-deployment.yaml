# OpenResty (Nginx + Lua) Deployment for Kubernetes Resilience Experiment
# Simulates CPU-intensive workload using Lua calculations
# Each request performs 1,000,000 sqrt() operations (similar to php-apache)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: k8s-resilience-experiment
  labels:
    app: php-apache
    experiment: resilience-test
spec:
  replicas: 3
  selector:
    matchLabels:
      run: php-apache
  template:
    metadata:
      labels:
        run: php-apache
        app: php-apache
    spec:
      containers:
      - name: php-apache
        image: openresty/openresty:alpine  # Nginx + Lua for CPU simulation
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 200m
            memory: 64Mi
          requests:
            cpu: 100m
            memory: 32Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /usr/local/openresty/nginx/conf/nginx.conf
          subPath: nginx.conf
        # Liveness probe - use lightweight endpoint
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 2
        # Readiness probe - use lightweight endpoint
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 3
          timeoutSeconds: 2
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
# Service to expose the deployment
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: k8s-resilience-experiment
  labels:
    run: php-apache
    experiment: resilience-test
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    run: php-apache
---
# NodePort Service for external access
apiVersion: v1
kind: Service
metadata:
  name: php-apache-nodeport
  namespace: k8s-resilience-experiment
  labels:
    run: php-apache
    experiment: resilience-test
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    run: php-apache
